{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Lar São Domingos{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'img/logo-lar-sao-domingos.png' %}">

    <!-- CSS do Select2 -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css" rel="stylesheet" />

    <!-- Estilo customizado para impressão -->
    <style>
        @media print {
            nav, footer, .btn, .no-print, .navbar { display: none !important; }
            body { background: #fff !important; }
            h2 { color: #000 !important; }
            table { width: 100% !important; border: none !important; }
            td, th { font-size: 1.1em; padding: 4px 8px; }
            .container { margin: 0 !important; width: 100% !important; }
        }
        /* Melhorar o visual do select2 */
        .select2-container .select2-selection--single {
            height: 38px;
            padding: 6px 12px;
            border: 1px solid #ced4da;
            border-radius: .375rem;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 24px;
        }

        #dashboard-plotly-wrapper > div {
            height: 70vh !important;
            min-height: 400px !important;
            padding-bottom: 0 !important;
            overflow: visible !important;
        }
        #dashboard-plotly-wrapper iframe {
            height: 100% !important;
            min-height: 400px !important;
        }
    </style>

    {% block extra_head %}
       {{ form.media }}
    {% endblock %}
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-light bg-light mb-4">
        <div class="container text-center">
            <img src="{% static 'img/logo-lar-sao-domingos.png' %}" alt="Lar São Domingos" height="48">
            <span class="fs-4 ms-3 fw-bold text-primary">Sistema Escola Lar São Domingos</span>
        </div>
    </nav>

    <!-- Main content -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="mt-5 text-center text-muted small">
        &copy; Infralyze {{ now|date:"Y" }} | 
        <a href="https://www.larsaodomingos.com.br/" target="_blank">Site Oficial</a>
    </footer>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Select2 direto do CDN -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/i18n/pt-BR.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}
        <script>
    $(document).ready(function() {
        console.log("jQuery versão:", $.fn.jquery);
        console.log("Select2 existe?:", $.fn.select2);

        
    });
    </script>

    {% endblock %}
</body>
</html>
