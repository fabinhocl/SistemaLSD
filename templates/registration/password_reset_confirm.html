{% extends "AppLSD/base.html" %}
{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="mb-3">Definir nova senha</h2>

                    {% if validlink %}
                        <form method="post">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label for="id_new_password1" class="form-label">Nova senha</label>
                                <input type="password" name="new_password1" class="form-control" id="id_new_password1" required>
                            </div>

                            <div class="mb-3">
                                <label for="id_new_password2" class="form-label">Confirmar nova senha</label>
                                <input type="password" name="new_password2" class="form-control" id="id_new_password2" required>
                            </div>

                            <button type="submit" class="btn btn-primary">
                                Salvar nova senha
                            </button>
                        </form>
                    {% else %}
                        <div class="alert alert-danger">
                            Este link de redefinição é inválido ou já foi utilizado.
                        </div>
                        <a href="{% url 'password_reset' %}" class="btn btn-primary">
                            Solicitar novo link
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
