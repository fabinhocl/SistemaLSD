{% extends "AppLSD/base.html" %}
{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    
                    <h2 class="mb-3">Redefinição de senha enviada</h2>

                    <p class="text-muted">
                        Se existir uma conta com o e-mail informado, enviamos uma mensagem com as instruções para redefinir sua senha.
                    </p>

                    <p class="text-muted mb-4">
                        Verifique também a caixa de spam ou lixo eletrônico.
                    </p>

                    <a href="{% url 'login' %}" class="btn btn-primary">
                        Voltar ao login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
