{% extends "AppLSD/base.html" %}
{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="mb-3">Recuperar senha</h2>
                    <p class="text-muted">Informe seu e-mail para receber o link de redefinição.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_email" class="form-label">E-mail</label>
                            <input type="email" name="email" class="form-control" id="id_email" required>
                        </div>

                        <button type="submit" class="btn btn-primary">Enviar link</button>
                        <a href="{% url 'login' %}" class="btn btn-secondary ms-2">Voltar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
