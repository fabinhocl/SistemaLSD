{% extends "AppLSD/base.html" %}
{% load plotly_dash %}

{% block content %}
<div class="container-fluid" style="min-height:80vh; padding-bottom:60px;">
    <div class="mb-3">
        <a href="{% url 'home_diretoria' %}" class="btn btn-secondary">Voltar para Home</a>
    </div>

    <h2 class="text-center">Relatório Geral</h2>

    <div id="dashboard-plotly-wrapper"
         style="width:100%; min-height:650px; display:block; overflow:visible;">
        {% plotly_app name="LSDDashboard" %}
    </div>
</div>

  
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    const wrapper = document.getElementById("dashboard-plotly-wrapper");
    if (!wrapper) return;  // só roda nesta página

    setTimeout(function () {
        const inner = wrapper.querySelector("div");
        if (inner) {
            inner.style.paddingBottom = "0";
            inner.style.height = "80vh";
            inner.style.overflow = "visible";
        }
        const iframe = wrapper.querySelector("iframe");
        if (iframe) {
            iframe.style.height = "100%";
            iframe.style.width = "100%";
        }
    }, 500);
});
</script>
{% endblock %}
