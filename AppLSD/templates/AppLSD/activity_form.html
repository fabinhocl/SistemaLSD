<!DOCTYPE html>
<html>
<head>
    <title>{% if form.instance.pk %}Editar{% else %}Cadastrar{% endif %} Atividades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1 class="mb-4">{% if form.instance.pk %}Editar{% else %}Cadastrar{% endif %} Atividades</h1>
    <form method="post" class="mb-4">
        {% csrf_token %}
        {% load crispy_forms_tags %}
        {{ form|crispy }}
        
        <button type="submit" class="btn btn-primary">{% if form.instance.pk %}Salvar Alterações{% else %}Salvar{% endif %}</button>
        <a href="{% url 'activity_list' %}" class="btn btn-secondary ms-2">Voltar para Lista</a>
        <a href="{% url 'home' %}" class="btn btn-outline-secondary ms-2">Home</a>
    </form>
</body>
</html>
