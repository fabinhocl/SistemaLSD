{% extends 'AppLSD/base.html' %}

{% block title %}
  Desligar assistido - {{ aluno.name }}
{% endblock %}

{% block content %}
  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-lg-7">

        <div class="card">
          <div class="card-header bg-danger text-white">
            <h5 class="mb-0">
              Desligar assistido
            </h5>
          </div>

          <div class="card-body">
            <p>
              Confirma o desligamento de
              <strong>{{ aluno.name }}</strong>?
            </p>

            <form
              method="post"
              action="{% url 'desativar_aluno' aluno.id %}"
            >
              {% csrf_token %}

              {% include 'AppLSD/includes/campos_desligamento_aluno.html' %}

              <div class="d-flex gap-2 mt-3">
                <button
                  type="submit"
                  class="btn btn-danger"
                >
                  Confirmar desligamento
                </button>

                <a
                  href="{% url 'aluno_detail' aluno.id %}"
                  class="btn btn-secondary"
                >
                  Cancelar
                </a>
              </div>
            </form>

          </div>
        </div>

      </div>
    </div>
  </div>
{% endblock %}
