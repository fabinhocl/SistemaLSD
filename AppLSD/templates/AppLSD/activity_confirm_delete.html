{% extends "AppLSD/base.html" %}
{% load static %}

{% block title %}Confirmação de Exclusão{% endblock %}

{% block content %}
    <title>Confirmar Exclusão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1>Tem certeza que deseja apagar esta Atividade?</h1>
    <p>{{ activity.atividade }} - {{ activity.tipo }}</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sim, excluir</button>
        <a href="{% url 'activity_list' %}">Cancelar</a>
    </form>
{% endblock %}
