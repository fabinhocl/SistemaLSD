{% extends "AppLSD/base.html" %}

{% block title %}Novo setor{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h1 class="h4 mb-0">Novo setor</h1>
                </div>

                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="{{ form.nome.id_for_label }}"
                                   class="form-label">
                                Nome *
                            </label>
                            {{ form.nome }}
                            {{ form.nome.errors }}
                        </div>

                        <div class="mb-3">
                            <label for="{{ form.descricao.id_for_label }}"
                                   class="form-label">
                                Descrição
                            </label>
                            {{ form.descricao }}
                            {{ form.descricao.errors }}
                        </div>

                        <div class="form-check mb-3">
                            {{ form.ativo }}
                            <label for="{{ form.ativo.id_for_label }}"
                                   class="form-check-label">
                                Setor ativo
                            </label>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'ged:lista_setores' %}"
                               class="btn btn-secondary">
                                Cancelar
                            </a>

                            <button type="submit" class="btn btn-primary">
                                Salvar setor
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
